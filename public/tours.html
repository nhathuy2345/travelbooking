<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Tour</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      margin:0;
      padding:20px;
    }

    h1{
      text-align:center;
    }

    .tour-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
      margin-top:30px;
    }

    .tour-card{
      background:#1e293b;
      border-radius:12px;
      overflow:hidden;
      padding:15px;
    }

    .tour-card img{
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius:8px;
    }

    .tour-title{
      font-size:20px;
      margin-top:10px;
      font-weight:bold;
    }

    .tour-price{
      color:#22c55e;
      font-size:18px;
      margin-top:10px;
    }

    .btn{
      margin-top:15px;
      width:100%;
      border:none;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
      background:#2563eb;
      color:white;
    }
  </style>
</head>
<body>

<h1>Danh Sách Tour Du Lịch</h1>

<div id="tour-list" class="tour-grid">
  Đang tải dữ liệu...
</div>

<script src="tours.js"></script>

</body>
</html>
